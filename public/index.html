<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Todo List</title>
  <link rel="stylesheet" href="main.css">
</head>

<body>

  <h1>Todo List</h1>

  <form id="todoForm">
    <input type="text" id="todoInput" placeholder="New todo" required />
    <input type="text" id="descriptionInput" placeholder="Description" />
    <button type="submit">Add Todo</button>
  </form>


  <ul id="todoList"></ul>

  <script>
    const API_URL = 'http://localhost:3000/todos';

    const todoForm = document.getElementById('todoForm');
    const todoInput = document.getElementById('todoInput');
    const descriptionInput = document.getElementById('descriptionInput');
    const todoList = document.getElementById('todoList');
    const confettiCanvas = document.getElementById('confettiCanvas');

    // Confetti setup
    function triggerConfetti() {
      const duration = 1 * 1000;
      const animationEnd = Date.now() + duration;
      const colors = ['#a864fd', '#29cdff'];

      (function frame() {
        confetti({
          particleCount: 2,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: colors
        });
        confetti({
          particleCount: 2,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: colors
        });

        if (Date.now() < animationEnd) {
          requestAnimationFrame(frame);
        }
      })();
    }

    // Load external confetti script
    const confettiScript = document.createElement('script');
    confettiScript.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js';
    document.head.appendChild(confettiScript);

    // Fetch todos and render list
    async function fetchTodos() {
      try {
        const res = await fetch(API_URL);
        const todos = await res.json();
        todoList.innerHTML = '';
        todos.forEach(todo => {
          const li = document.createElement('li');
          if (todo.completed) {
            li.classList.add('completed');
          }

          const textSpan = document.createElement('span');
          textSpan.className = 'todo-text';
          textSpan.textContent = todo.name;

          const desc = document.createElement('p');
          desc.className = 'todo-description';
          desc.textContent = todo.description || '';

          const actions = document.createElement('div');
          actions.className = 'actions';

          const toggleBtn = document.createElement('button');
          toggleBtn.textContent = todo.completed ? 'Undo' : 'Complete';
          toggleBtn.onclick = () => {
            toggleComplete(todo._id, !todo.completed);
            if (!todo.completed) triggerConfetti();
          };

          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = 'Delete';
          deleteBtn.onclick = () => deleteTodo(todo._id);

          actions.appendChild(toggleBtn);
          actions.appendChild(deleteBtn);

          li.appendChild(textSpan);
          li.appendChild(desc);
          li.appendChild(actions);
          todoList.appendChild(li);
        });
      } catch (error) {
        console.error('Failed to fetch todos', error);
      }
    }

    todoForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newTodo = { name: todoInput.value, completed: false, description: descriptionInput.value };
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newTodo)
        });
        if (res.ok) {
          todoInput.value = '';
          descriptionInput.value = '';
          fetchTodos();
        } else {
          console.error('Failed to add todo');
        }
      } catch (error) {
        console.error('Error adding todo:', error);
      }
    });

    async function toggleComplete(id, completed) {
      try {
        await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed })
        });
        fetchTodos();
      } catch (error) {
        console.error('Error toggling todo:', error);
      }
    }

    async function deleteTodo(id) {
      try {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        fetchTodos();
      } catch (error) {
        console.error('Error deleting todo:', error);
      }
    }

    fetchTodos();
  </script>
</body>

</html>
